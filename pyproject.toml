[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-terminal-agent"
version = "0.1.0"
description = "A small-model-friendly terminal agent with schema-guided tool use."
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
tinyagent = "tinyagent.cli:main"

[tool.setuptools.packages.find]
include = ["tinyagent*"]
